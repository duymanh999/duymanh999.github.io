<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Mạnh Duy</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
}

body{
  background:#090909;
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(#0003,#000b),
    url("background.jpg") center/cover no-repeat;
  z-index:-2;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.18);
  backdrop-filter:blur(2px);
  z-index:-1;
}

main{
  width:min(100%,560px);
  margin:auto;
  padding:58px 18px 32px;
}

.profile{
  text-align:center;
}

/* AVATAR */
.avatar{
  width:108px;
  height:108px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  box-shadow:0 10px 35px #0008;
}

h1{
  margin:14px 0 4px;
  font-size:28px;
  font-weight:800;
}

.sub{
  margin:0 0 27px;
  color:#ddd;
  font-size:13px;
}

.links{
  display:grid;
  gap:13px;
}

.link{
  height:62px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:9px 16px;
  text-decoration:none;
  color:#fff;
  background:#111b;
  border:1px solid #fff2;
  border-radius:18px;
  backdrop-filter:blur(14px);
  box-shadow:0 8px 24px #0005;
  transition:.15s;
}

.link:active{
  transform:scale(.98);
}

.icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#fff1;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:700;
}

.label{
  font-size:16px;
  font-weight:700;
}

.arrow{
  margin-left:auto;
  font-size:23px;
  color:#aaa;
}

footer{
  text-align:center;
  margin-top:27px;
  color:#aaa;
  font-size:12px;
}
</style>
</head>

<body>

<div class="bg"></div>

<main>

<section class="profile">

<img class="avatar" src="avatar.jpg" alt="Mạnh Duy">

<h1>Mạnh Duy</h1>

<p class="sub">MOD • FREE FIRE • IOS / ANDROID</p>

</section>

<span class="arrow">›</span>

</main>

</body>
</html>
