<meta name="description" content="Duy Mạnh - Nền tảng của tôi">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  background:#050509;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",Roboto,Arial,sans-serif;
  position:relative;
}

/* =========================
   BACKGROUND
========================= */

.bg{
  position:fixed;
  inset:-12%;
  z-index:0;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.18),
      rgba(0,0,0,.72)
    ),
    url("background.jpg") center center / cover no-repeat;

  animation:bgMove 18s ease-in-out infinite alternate;
  transform:translate3d(0,0,0) scale(1.06);
  will-change:transform;
}

@keyframes bgMove{
  0%{
    transform:translate3d(-1.5%,-1%,0) scale(1.06);
  }

  50%{
    transform:translate3d(1%,1%,0) scale(1.10);
  }

  100%{
    transform:translate3d(-1%,1.5%,0) scale(1.07);
  }
}

/* =========================
   ÁNH SÁNG
========================= */

.ambient{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:1;
  pointer-events:none;
}

.orb{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(255,255,255,.14),
    rgba(150,100,255,.08),
    transparent 70%
  );

  filter:blur(15px);
  opacity:.7;

  animation:orbMove 12s ease-in-out infinite alternate;
}

.orb.one{
  top:-100px;
  left:-80px;
}

.orb.two{
  right:-100px;
  bottom:5%;
  animation-delay:-4s;
  animation-duration:16s;
}

.orb.three{
  width:200px;
  height:200px;
  left:40%;
  top:35%;
  animation-delay:-7s;
  animation-duration:19s;
}

@keyframes orbMove{
  0%{
    transform:translate3d(-30px,-20px,0) scale(.85);
  }

  50%{
    transform:translate3d(70px,50px,0) scale(1.15);
  }

  100%{
    transform:translate3d(-50px,80px,0) scale(.9);
  }
}

/* =========================
   MƯA
========================= */

#rain{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
}

.drop{
  position:absolute;
  top:-80px;
  width:1px;
  height:65px;

  background:linear-gradient(
    to bottom,
    transparent,
    rgba(255,255,255,.55)
  );

  opacity:.35;
  transform:rotate(12deg);

  animation:rainFall linear infinite;
}

@keyframes rainFall{
  from{
    transform:translate3d(0,-100px,0) rotate(12deg);
  }

  to{
    transform:translate3d(-130px,115vh,0) rotate(12deg);
  }
}

/* =========================
   HẠT SÁNG
========================= */

.particles{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
}

.particle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 12px rgba(255,255,255,.9);

  animation:particleFloat linear infinite;
}

@keyframes particleFloat{
  0%{
    transform:translate3d(0,110vh,0) scale(.3);
    opacity:0;
  }

  15%{
    opacity:.8;
  }

  50%{
    opacity:1;
  }

  100%{
    transform:translate3d(50px,-10vh,0) scale(1);
    opacity:0;
  }
}

/* =========================
   LỚP TỐI
========================= */

.vignette{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;

  background:
    radial-gradient(
      circle at center,
      transparent 20%,
      rgba(0,0,0,.22) 75%,
      rgba(0,0,0,.65) 100%
    );
}

/* =========================
   MAIN
========================= */

main{
  position:relative;
  z-index:10;

  width:min(440px,92%);
  margin:auto;

  min-height:100vh;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    max(45px,env(safe-area-inset-top))
    0
    max(35px,env(safe-area-inset-bottom));

  text-align:center;
}

/* =========================
   AVATAR
========================= */

.avatar-wrap{
  position:relative;
  margin-top:10px;
  margin-bottom:18px;

  animation:avatarFloat 4s ease-in-out infinite;
}

.avatar-wrap::before{
  content:"";
  position:absolute;
  inset:-12px;

  border-radius:50%;

  background:conic-gradient(
    from 0deg,
    rgba(255,255,255,.8),
    rgba(130,100,255,.3),
    rgba(255,255,255,.05),
    rgba(255,255,255,.8)
  );

  filter:blur(8px);
  opacity:.7;

  animation:avatarGlow 5s linear infinite;
}

.avatar{
  position:relative;

  width:108px;
  height:108px;

  border-radius:50%;

  object-fit:cover;

  border:3px solid rgba(255,255,255,.9);

  box-shadow:
    0 0 20px rgba(255,255,255,.35),
    0 0 60px rgba(150,100,255,.35);

  display:block;
}

@keyframes avatarFloat{
  0%,100%{
    transform:translateY(0) rotate(0deg);
  }

  50%{
    transform:translateY(-8px) rotate(1deg);
  }
}

@keyframes avatarGlow{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   TÊN
========================= */

h1{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;

  font-size:31px;
  font-weight:800;
  letter-spacing:-.7px;

  text-shadow:
    0 0 12px rgba(255,255,255,.25),
    0 0 35px rgba(150,100,255,.2);

  animation:titleGlow 3s ease-in-out infinite alternate;
}

/* =========================
   DẤU TÍCH XANH
========================= */

.verified{
  width:27px;
  height:27px;

  display:block;
  flex:none;

  filter:
    drop-shadow(0 0 5px rgba(0,140,255,.8))
    drop-shadow(0 0 13px rgba(0,140,255,.5));

  animation:verifiedGlow 2s ease-in-out infinite;
}

@keyframes verifiedGlow{
  0%,100%{
    transform:scale(1);
    filter:
      drop-shadow(0 0 5px rgba(0,140,255,.75))
      drop-shadow(0 0 12px rgba(0,140,255,.35));
  }

  50%{
    transform:scale(1.08);
    filter:
      drop-shadow(0 0 9px rgba(0,150,255,1))
      drop-shadow(0 0 20px rgba(0,140,255,.6));
  }
}

.subtitle{
  margin-top:6px;

  color:rgba(255,255,255,.7);

  font-size:14px;
  letter-spacing:.4px;
}

@keyframes titleGlow{
  from{
    text-shadow:
      0 0 10px rgba(255,255,255,.15);
  }

  to{
    text-shadow:
      0 0 20px rgba(255,255,255,.35),
      0 0 40px rgba(130,100,255,.25);
  }
}

/* =========================
   MUSIC
========================= */

.music-card{
  width:100%;
  margin-top:25px;
  padding:15px;

  border-radius:22px;

  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:
    0 15px 50px rgba(0,0,0,.28),
    inset 0 1px rgba(255,255,255,.12);

  transition:.35s;
}

.music-card.playing{
  box-shadow:
    0 0 25px rgba(150,100,255,.25),
    0 15px 50px rgba(0,0,0,.3),
    inset 0 1px rgba(255,255,255,.15);
}

.music-top{
  display:flex;
  align-items:center;
  gap:13px;
}

.disc{
  width:54px;
  height:54px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at center,
      #111 0 8%,
      #eee 9% 11%,
      #111 12% 20%,
      #aaa 21% 23%,
      #111 24% 100%
    );

  box-shadow:
    0 0 15px rgba(0,0,0,.5);

  flex:none;
}

.playing .disc{
  animation:spinDisc 3s linear infinite;
}

@keyframes spinDisc{
  to{
    transform:rotate(360deg);
  }
}

.song-info{
  text-align:left;
  flex:1;
}

.song-title{
  font-size:16px;
  font-weight:700;
}

.song-status{
  font-size:12px;
  color:rgba(255,255,255,.6);
  margin-top:3px;
}

.music-btn{
  width:44px;
  height:44px;

  border:none;
  border-radius:50%;

  color:white;
  background:rgba(255,255,255,.16);

  font-size:17px;

  cursor:pointer;

  transition:.25s;

  box-shadow:
    0 0 15px rgba(255,255,255,.08);
}

.music-btn:hover{
  transform:scale(1.08);
  background:rgba(255,255,255,.25);
}

.music-btn:active{
  transform:scale(.88);
}

.progress{
  height:4px;
  width:100%;

  margin-top:14px;

  border-radius:10px;

  background:rgba(255,255,255,.12);

  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;

  background:white;

  box-shadow:
    0 0 10px rgba(255,255,255,.8);

  transition:width .1s linear;
}

/* =========================
   LINKS
========================= */

.links{
  width:100%;
  margin-top:18px;

  display:flex;
  flex-direction:column;
  gap:12px;
}

.link{
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  min-height:58px;
  padding:0 18px;

  border-radius:18px;

  color:white;
  text-decoration:none;

  background:rgba(255,255,255,.09);

  border:1px solid rgba(255,255,255,.16);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  box-shadow:
    0 10px 30px rgba(0,0,0,.20),
    inset 0 1px rgba(255,255,255,.08);

  font-size:15px;
  font-weight:650;

  transition:
    transform .28s ease,
    background .28s ease,
    box-shadow .28s ease;

  animation:buttonFloat 5s ease-in-out infinite;
}

.link:nth-child(2){
  animation-delay:-1s;
}

.link:nth-child(3){
  animation-delay:-2s;
}

.link:nth-child(4){
  animation-delay:-3s;
}

.link::before{
  content:"";

  position:absolute;
  inset:-2px;

  border-radius:20px;

  background:linear-gradient(
    120deg,
    transparent 20%,
    rgba(255,255,255,.55),
    transparent 80%
  );

  transform:translateX(-120%);
  transition:transform .7s ease;

  z-index:-1;
}

.link:hover::before{
  transform:translateX(120%);
}

.link::after{
  content:"";

  position:absolute;
  top:0;
  left:-80%;

  width:50%;
  height:100%;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );

  transform:skewX(-20deg);

  animation:shine 4s ease-in-out infinite;
}

@keyframes shine{
  0%,55%{
    left:-80%;
  }

  75%,100%{
    left:130%;
  }
}

.link:hover{
  transform:
    translateY(-4px)
    scale(1.015);

  background:rgba(255,255,255,.15);

  box-shadow:
    0 15px 40px rgba(0,0,0,.35),
    0 0 25px rgba(255,255,255,.08);
}

.link:active{
  transform:scale(.96);
}

@keyframes buttonFloat{
  0%,100%{
    translate:0 0;
  }

  50%{
    translate:0 -2px;
  }
}

/* =========================
   ICON MẠNG XÃ HỘI
========================= */

.social-icon{
  width:38px;
  height:38px;

  margin-right:11px;

  flex:none;

  transition:
    transform .3s ease,
    filter .3s ease;
}

.link:hover .social-icon{
  transform:scale(1.13) rotate(-3deg);

  filter:
    drop-shadow(0 0 8px rgba(255,255,255,.55));
}

.link:active .social-icon{
  transform:scale(.9);
}

/* =========================
   VISITOR
========================= */

.visitor{
  width:100%;

  margin-top:18px;
  padding:14px 18px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  border-radius:17px;

  background:rgba(255,255,255,.07);

  border:1px solid rgba(255,255,255,.12);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  color:rgba(255,255,255,.78);

  font-size:13px;
}

.visitor-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#6dff9a;

  box-shadow:
    0 0 12px #6dff9a;

  animation:livePulse 1.5s infinite;
}

#visitorCount{
  color:white;
  font-size:15px;
  font-weight:800;
}

@keyframes livePulse{
  0%,100%{
    opacity:.5;
    transform:scale(.8);
  }

  50%{
    opacity:1;
    transform:scale(1.2);
  }
}

/* =========================
   FOOTER
========================= */

footer{
  margin-top:auto;
  padding-top:28px;

  font-size:11px;
  color:rgba(255,255,255,.42);
}

/* =========================
   RIPPLE
========================= */

.ripple{
  position:absolute;

  width:10px;
  height:10px;

  border-radius:50%;

  background:rgba(255,255,255,.35);

  transform:translate(-50%,-50%) scale(0);

  animation:ripple .65s ease-out forwards;

  pointer-events:none;
}

@keyframes ripple{
  to{
    transform:translate(-50%,-50%) scale(22);
    opacity:0;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  main{
    width:calc(100% - 28px);
  }

  .avatar{
    width:100px;
    height:100px;
  }

  h1{
    font-size:28px;
  }

  .verified{
    width:24px;
    height:24px;
  }

  .social-icon{
    width:36px;
    height:36px;
  }

  .link{
    min-height:57px;
  }

  .drop{
    height:55px;
  }
}

/* =========================
   GIẢM CHUYỂN ĐỘNG
========================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

<script>

/* =========================
   MƯA
========================= */

const rain =
  document.getElementById("rain");

const rainAmount =
  window.innerWidth < 600 ? 65 : 100;

for(let i = 0; i < rainAmount; i++){

  const drop =
    document.createElement("span");

  drop.className = "drop";

  drop.style.left =
    Math.random() * 115 + "%";

  drop.style.height =
    (35 + Math.random() * 60) + "px";

  drop.style.opacity =
    .12 + Math.random() * .45;

  drop.style.animationDuration =
    (0.65 + Math.random() * 1.15) + "s";

  drop.style.animationDelay =
    (-Math.random() * 3) + "s";

  rain.appendChild(drop);
}


/* =========================
   HẠT ÁNH SÁNG
========================= */

const particles =
  document.getElementById("particles");

const particleAmount =
  window.innerWidth < 600 ? 18 : 28;

for(let i = 0; i < particleAmount; i++){

  const p =
    document.createElement("span");

  p.className = "particle";

  p.style.left =
    Math.random() * 100 + "%";

  p.style.animationDuration =
    (7 + Math.random() * 10) + "s";

  p.style.animationDelay =
    (-Math.random() * 12) + "s";

  const size =
    2 + Math.random() * 3;

  p.style.width =
    size + "px";

  p.style.height =
    size + "px";

  particles.appendChild(p);
}


/* =========================
   MUSIC
========================= */

const music =
  document.getElementById("music");

const musicBtn =
  document.getElementById("musicBtn");

const musicCard =
  document.getElementById("musicCard");

const status =
  document.getElementById("status");

const progressBar =
  document.getElementById("progressBar");


function playMusic(){

  music.volume = .7;

  music.play()
    .then(() => {

      musicBtn.textContent = "❚❚";

      status.textContent =
        "Đang phát • Shape of You";

      musicCard.classList.add("playing");

    })
    .catch(() => {

      status.textContent =
        "Nhấn ▶ để phát nhạc";

    });

}


function pauseMusic(){

  music.pause();

  musicBtn.textContent = "▶";

  status.textContent =
    "Đã tạm dừng";

  musicCard.classList.remove("playing");

}


musicBtn.addEventListener(
  "click",
  () => {

    if(music.paused){
      playMusic();
    }else{
      pauseMusic();
    }

  }
);


music.addEventListener(
  "timeupdate",
  () => {

    if(!music.duration) return;

    const percent =
      (music.currentTime / music.duration) * 100;

    progressBar.style.width =
      percent + "%";

  }
);


music.addEventListener(
  "play",
  () => {

    musicBtn.textContent = "❚❚";

    status.textContent =
      "Đang phát • Shape of You";

    musicCard.classList.add("playing");

  }
);


music.addEventListener(
  "pause",
  () => {

    musicBtn.textContent = "▶";

    musicCard.classList.remove("playing");

  }
);


/* =========================
   THANH NHẠC
========================= */

document
  .querySelector(".progress")
  .addEventListener(
    "click",
    (e) => {

      if(!music.duration) return;

      const rect =
        e.currentTarget.getBoundingClientRect();

      const percent =
        (e.clientX - rect.left) /
        rect.width;

      music.currentTime =
        percent * music.duration;

    }
  );


/* =========================
   RIPPLE NÚT
========================= */

document
  .querySelectorAll(".link")
  .forEach(link => {

    link.addEventListener(
      "click",
      function(e){

        const rect =
          this.getBoundingClientRect();

        const ripple =
          document.createElement("span");

        ripple.className = "ripple";

        ripple.style.left =
          (e.clientX - rect.left) + "px";

        ripple.style.top =
          (e.clientY - rect.top) + "px";

        this.appendChild(ripple);

        setTimeout(
          () => ripple.remove(),
          700
        );

      }
    );

  });


/* =========================
   LƯỢT TRUY CẬP
   BẮT ĐẦU TỪ 157.000
========================= */

async function loadVisitorCount(){

  const element =
    document.getElementById(
      "visitorCount"
    );

  const START_COUNT = 157000;

  try{

    if(typeof Counter === "undefined"){

      element.textContent =
        START_COUNT.toLocaleString("vi-VN");

      return;

    }

    /*
      Dùng một counter mới riêng cho mốc 157K.
      Lượt đầu tiên của counter = 1
      => hiển thị 157.000

      Lượt tiếp theo = 2
      => hiển thị 157.001

      Lượt tiếp theo = 3
      => hiển thị 157.002
    */

    const counter =
      new Counter({
        workspace:
          "duymanh999-github-io"
      });

    const result =
      await counter.up(
        "page-views-157k"
      );

    const current =
      Number(
        result &&
        typeof result.value !== "undefined"
          ? result.value
          : 1
      );

    const total =
      START_COUNT +
      Math.max(0,current - 1);

    element.textContent =
      total.toLocaleString("vi-VN");

  }catch(error){

    console.log(
      "Visitor counter:",
      error
    );

    element.textContent =
      START_COUNT.toLocaleString("vi-VN");

  }

}

loadVisitorCount();


/* =========================
   TỰ PHÁT NHẠC
========================= */

let firstInteraction =
  false;

function firstPlay(){

  if(firstInteraction) return;

  firstInteraction = true;

  playMusic();

  document.removeEventListener(
    "touchstart",
    firstPlay
  );

  document.removeEventListener(
    "click",
    firstPlay
  );

}


document.addEventListener(
  "touchstart",
  firstPlay,
  {passive:true}
);

document.addEventListener(
  "click",
  firstPlay
);


/* =========================
   AUTOPLAY
========================= */

window.addEventListener(
  "load",
  () => {

    setTimeout(
      () => {

        music.volume = .7;

        music.play()
          .catch(() => {
            /* iPhone có thể chặn autoplay */
          });

      },
      700
    );

  }
);

</script>

</body>
</html>
